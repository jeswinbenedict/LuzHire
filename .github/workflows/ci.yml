name: CI

on:
  pull_request:
  push:
    branches: [main, 'phase-*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  database:
    name: Database (migrations, RLS, pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fast check in PGlite (same command developers run without Docker).
      - run: npm run db:check
      # The real thing: full local Supabase stack + genuine pgTAP.
      - run: npx supabase start
      - run: npx supabase test db
      - run: npx supabase db lint --level error
      - if: always()
        run: npx supabase stop --no-backup

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --wasm --release --no-web-resources-cdn --dart-define-from-file=env/example.json
