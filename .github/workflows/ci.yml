name: CI

on:
  pull_request:
  push:
    branches: [main, 'phase-*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  database:
    name: Database (migrations, RLS, pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fast check in PGlite (same command developers run without Docker).
      - run: npm run db:check
      # The real thing: full local Supabase stack + genuine pgTAP.
      - run: npx supabase start
      - run: npx supabase test db
      - run: npx supabase db lint --level error
      - if: always()
        run: npx supabase stop --no-backup

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan the whole history, not just this commit
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          f=gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
      - run: ./gitleaks git --redact --no-banner --exit-code 1 .

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --wasm --release --no-web-resources-cdn --dart-define-from-file=env/example.json
