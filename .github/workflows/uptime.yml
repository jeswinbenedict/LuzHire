name: Uptime

# Checks the live site every 30 minutes. A failed scheduled run makes GitHub
# email the person who last changed this schedule (the project owner).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ vars.PRODUCTION_URL || 'https://luzhire.vercel.app' }}
    steps:
      - name: Site, API and database answer
        run: |
          fail=0
          check() {
            code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 20 --retry 3 --retry-delay 10 --retry-all-errors "$URL$1")
            echo "$1 -> $code"
            [ "$code" = "200" ] || { echo "::error::$1 returned $code"; fail=1; }
          }
          check /
          check /jobs
          check '/api/health?deep=1'
          grep -q '"database":"ok"' /tmp/body || { echo "::error::database check failed: $(cat /tmp/body)"; fail=1; }
          exit $fail
