<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LuzHire — find verified jobs, apply in one place, and track every application in real time.">
  <meta name="theme-color" content="#EEECE7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1D1F23" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LuzHire">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon.png">

  <!-- Flutter fetches these only after the engine starts; preloading them
       overlaps the downloads with main.dart.wasm (Phase 10). Same-origin
       fetch() needs crossorigin to reuse the preload. -->
  <link rel="preload" href="assets/FontManifest.json" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-Variable.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/PlusJakartaSans-Variable.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/assets/fonts/JetBrainsMono-Variable.ttf" as="fetch" crossorigin>
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="fetch" crossorigin>
  <link rel="preload" href="assets/fonts/fallback/Roboto-Regular.ttf" as="fetch" crossorigin>
  <link rel="preconnect" href="https://www.gstatic.com">

  <title>LuzHire</title>
  <link rel="manifest" href="manifest.json">

  <!-- Splash painted before the Flutter engine loads (DESIGN.md porcelain / graphite + official mark). -->
  <style>
    :root { --base: #EEECE7; --ink: #14110F; --edge: transparent; }
    @media (prefers-color-scheme: dark) {
      :root { --base: #1D1F23; --ink: #F2F2EF; --edge: rgba(255,255,255,.12); }
    }
    html, body { margin: 0; height: 100%; background: var(--base); }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink); transition: opacity .25s ease;
    }
    #splash svg { width: 56px; height: 56px; border-radius: 14px; box-shadow: 0 0 0 1px var(--edge); }
    #splash .name { font-weight: 500; font-size: 32px; letter-spacing: -.4px; }
    #splash .dot { animation: pulse 1.4s ease-in-out infinite; transform-origin: 190px 186.5px; }
    @keyframes pulse { 50% { transform: scale(.82); } }
    @media (prefers-reduced-motion: reduce) { #splash .dot { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Loading LuzHire">
    <svg viewBox="0 0 264 264" aria-hidden="true">
      <rect width="264" height="264" rx="64" fill="#131314"/>
      <path d="M55.5 68.5V161.5A50 50 0 0 0 105.5 211.5H161.38A38 38 0 0 1 155.09 171.5H107.5A12 12 0 0 1 95.5 159.5V68.5A20 20 0 0 0 55.5 68.5Z" fill="#FFFFFF"/>
      <circle class="dot" cx="190" cy="186.5" r="30" fill="#FE8022"/>
    </svg>
    <div class="name">LuzHire</div>
  </div>
  <script src="firebase-sdk.js"></script>
  <script src="splash.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
